[workspace]
members = ["crates/tenet", "crates/tenet-contracts", "crates/tenet-engine"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
homepage = "https://tenet-contracts.com"
repository = "https://github.com/macromackie/tenet"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
ignore = "0.4"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "signal", "time"] }
tempfile = "3"
toml = "0.9"
annotate-snippets = "0.12"
console = "0.16"
ev-grep-core = { git = "https://github.com/macromackie/ev-grep", rev = "5a1b8f59970fa105d4221814ea2ba084ac8612cf" }
ev-grep-jev = { git = "https://github.com/macromackie/ev-grep", rev = "5a1b8f59970fa105d4221814ea2ba084ac8612cf" }
tenet-contracts = { path = "crates/tenet-contracts" }
tenet-engine = { path = "crates/tenet-engine" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
ci = "github"
dispatch-releases = true
installers = ["shell"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
install-path = "~/.local/bin"
install-updater = false
checksum = "sha256"
pr-run-mode = "upload"
plan-jobs = ["./check"]
global-artifacts-jobs = ["./release-smoke"]

[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"swatinem/rust-cache" = "49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c"
