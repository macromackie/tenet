name: Check
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify release source
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != 'dry-run' && github.event.inputs.tag != ''
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$RELEASE_TAG" = "v$version"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p tenet
      - run: ./target/release/tenet --version
