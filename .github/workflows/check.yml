---
"concurrency":
  "cancel-in-progress": true
  # A release calls this workflow too; its own workflow name keeps its run out of the push group.
  "group": "${{ github.workflow }}-check-${{ github.ref }}"
"jobs":
  "rust":
    "name": "Rust"
    "runs-on": "namespace-profile-public-linux"
    "steps":
      - "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
        "with":
          "persist-credentials": false
      - "env":
          "RELEASE_TAG": "${{ github.event.inputs.tag }}"
        "if": "github.event_name == 'workflow_dispatch' && github.event.inputs.tag != 'dry-run' && github.event.inputs.tag != ''"
        "name": "Verify release source"
        "run": |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "${RELEASE_TAG}" = "v${version}"
          test "${GITHUB_REF}" = "refs/tags/${RELEASE_TAG}"
          head=$(git rev-parse HEAD)
          test "${head}" = "${GITHUB_SHA}"
      - "uses": "astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78" # v7
        "with":
          "python-version": "3.14.7"
          "version": "0.12.9"
      - "name": "Check source duplication"
        "run": |
          shasum -a 256 --check .checks/clone-detector/SHA256SUMS
          uv run --locked --script .checks/clone-detector/check-clones.py --root . --config copy-detector.json
      - "name": "Check package dependencies"
        "run": |
          shasum -a 256 --check .checks/package-boundaries/SHA256SUMS
          uv run --locked --script .checks/package-boundaries/check-package-boundaries.py --root . --config package-boundaries.json
      - "run": "rustup show"
      - "uses": "Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0" # v2.9.3
        "with":
          "cache-directories": "~/.cargo/advisory-dbs"
      - "uses": "jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c" # v4.3.0
        "with":
          "cache": false
          "env": false
          "install_args": "aqua:EmbarkStudios/cargo-deny@0.19.9"
          "version": "2026.8.12"
      - "name": "Check dependency advisories and policies"
        "run": "mise exec aqua:EmbarkStudios/cargo-deny@0.19.9 -- cargo deny --all-features --locked check --deny warnings"
      # rustfmt.toml uses unstable options, so formatting runs on one dated nightly rustfmt.
      # Every other step uses the stable toolchain.
      - "run": "rustup toolchain install nightly-2026-10-27 --profile minimal --component rustfmt"
      - "run": "cargo +nightly-2026-10-27 fmt --all --check"
      - "run": "cargo clippy --workspace --all-targets --locked -- -D warnings"
      - "run": "cargo test --workspace --locked"
      # Release builds and smoke-tests the production binary for every target, so its check skips this copy.
      - "if": "github.workflow != 'Release'"
        "name": "Build the production binary"
        "run": |
          cargo build --release --locked -p tenet
          ./target/release/tenet --version
    "timeout-minutes": 10
"name": "Check"
"on":
  "pull_request": {}
  "push": {}
  "workflow_call":
    "inputs":
      "plan":
        "required": false
        "type": "string"
"permissions":
  "contents": "read"
...
