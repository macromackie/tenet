---
"jobs":
  "smoke":
    "name": "Smoke ${{ matrix.target }}"
    "runs-on": "${{ matrix.runner }}"
    "steps":
      - "env":
          "EXPECTED_MACHINE": "${{ matrix.machine }}"
        "name": "Verify native architecture"
        "run": |
          machine=$(uname -m)
          test "${machine}" = "${EXPECTED_MACHINE}"
      - "if": "matrix.target == 'x86_64-apple-darwin'"
        "name": "Reject Rosetta translation"
        "run": |
          translated=$(/usr/sbin/sysctl -in sysctl.proc_translated)
          [[ "${translated}" =~ ^0?$ ]]
        "shell": "bash"
      - "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        "with":
          "merge-multiple": true
          "path": "artifacts"
          "pattern": "artifacts-build-local-*"
      - "env":
          "PLAN": "${{ inputs.plan }}"
          "TARGET": "${{ matrix.target }}"
        "name": "Run packaged binary"
        "run": |
          set -euo pipefail
          archive="artifacts/tenet-${TARGET}.tar.xz"
          expected=$(awk '{print $1}' "${archive}.sha256")
          actual=$(shasum -a 256 "${archive}" | awk '{print $1}')
          test "${actual}" = "${expected}"
          mkdir unpacked
          tar -xJf "${archive}" -C unpacked
          binary="${PWD}/unpacked/tenet-${TARGET}/tenet"
          version=$(printf '%s' "${PLAN}" | jq -r '.releases[] | select(.app_name == "tenet") | .app_version')
          reported=$("${binary}" --version)
          test "${reported}" = "tenet ${version}"
          "${binary}" --help
          mkdir -p fixture/.contracts/001-errors
          printf '%s\n' '---' 'name: errors' 'message: Preserve failures.' '---' '## Rules' 'Preserve failures.' > fixture/.contracts/001-errors/CONTRACT.md
          printf 'fn main() {}\n' > fixture/sample.rs
          "${binary}" --root fixture validate
          "${binary}" --root fixture check --dry-run --json > output.jsonl
          jq -s -e '[.[] | select(.type == "selected")] | length == 1' output.jsonl
        "shell": "bash"
      # A review sends real requests through the packaged HTTP client, so a provider on localhost answers each question
      # with a violation. The check stays pending until a record settles it, and the next check reuses every answer.
      - "env":
          "NO_PROXY": "127.0.0.1"
          "OPENROUTER_API_KEY": "smoke-test-key"
          "TARGET": "${{ matrix.target }}"
        "name": "Review against a local fake provider"
        "run": |
          set -euo pipefail
          binary="${PWD}/unpacked/tenet-${TARGET}/tenet"
          cat > provider.py <<'PY'
          import http.server, json, socketserver, sys

          VIOLATION = {"type": "choice", "choice": "match", "confidence": 0.95,
                       "probabilities": {"match": 0.95, "no_match": 0.03, "uncertain": 0.02}}

          class Provider(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  request = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                  with open("requests.log", "a") as log:
                      log.write(self.headers["Authorization"] + "\n")
                  answers = {question: VIOLATION for question in request["questions"]}
                  body = json.dumps({"model": request["model"], "answers": answers,
                                     "usage": {"input_tokens": 1, "output_tokens": 1}}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

          server = socketserver.TCPServer(("127.0.0.1", 0), Provider)
          with open(sys.argv[1], "w") as port:
              port.write(str(server.server_address[1]))
          server.serve_forever()
          PY
          python3 provider.py port.txt &
          provider=${!}
          trap 'kill "${provider}"' EXIT
          until test -s port.txt; do
            if ! kill -0 "${provider}" 2>/dev/null; then
              wait "${provider}"
              printf '%s\n' 'fake provider stopped before writing "port.txt"' >&2
              exit 1
            fi
            sleep 0.1
          done
          TENET_ENDPOINT="http://127.0.0.1:$(cat port.txt)/decisions"
          export TENET_ENDPOINT
          # One job sends no duplicate request, so the provider receives exactly the dry run's count.
          code=0
          "${binary}" --root fixture check --jobs 1 || code=${?}
          test "${code}" = 4
          planned=$(jq -s '[.[] | select(.type == "summary")][0].requests' output.jsonl)
          sent=$(awk 'END { print NR }' requests.log)
          test "${sent}" = "${planned}"
          authorizations=$(sort -u requests.log)
          test "${authorizations}" = "Bearer ${OPENROUTER_API_KEY}"
          code=0
          "${binary}" --root fixture status || code=${?}
          test "${code}" = 4
          "${binary}" --root fixture record errors --conclusion verified --evidence sample.rs:1 -m 'main loses no failure.'
          "${binary}" --root fixture status
          "${binary}" --root fixture check --jobs 1 --json > recheck.jsonl
          jq -s -e --argjson planned "${planned}" \
            '[.[] | select(.type == "summary")][0] | .exit_code == 0 and .summary.requests == 0 and .summary.cached == $planned' recheck.jsonl
          sent=$(awk 'END { print NR }' requests.log)
          test "${sent}" = "${planned}"
        "shell": "bash"
    "strategy":
      "fail-fast": false
      "matrix":
        "include":
          - "machine": "arm64"
            "runner": "namespace-profile-public-macos"
            "target": "aarch64-apple-darwin"
          - "machine": "x86_64"
            "runner": "macos-15-intel"
            "target": "x86_64-apple-darwin"
          - "machine": "aarch64"
            "runner": "namespace-profile-release-linux-arm64"
            "target": "aarch64-unknown-linux-gnu"
          - "machine": "x86_64"
            "runner": "namespace-profile-release-linux"
            "target": "x86_64-unknown-linux-gnu"
    "timeout-minutes": 5
"name": "Release smoke tests"
"on":
  "workflow_call":
    "inputs":
      "plan":
        "required": true
        "type": "string"
"permissions":
  "contents": "read"
...
