# The strictest cargo-deny settings that code-lint-strictness requires.
# Every check runs, every lint level is deny, and every list that allows something starts empty.
#
# cargo-deny reads only its own file, so copy this file to `deny.toml` beside the workspace's root manifest.
# Fill that copy's allow lists: each license expression the dependencies carry, each registry and git source,
# each crate whose build script runs, and each crate allowed to keep its default features.
# Give each entry a comment naming the dependency that needs it.
# Run it from the workspace root, with every warning raised to an error:
#   cargo deny --all-features --locked check --deny warnings
# The advisories check fetches the advisory database, so the run needs network access to it.
# A new cargo-deny version adds checks, so this file is tested against cargo-deny 0.19.9;
# pin that exact version and raise it in a reviewed upgrade.

[advisories]
ignore = []
unmaintained = "all"
unsound = "all"
yanked = "deny"

[bans]
allow = []
allow-wildcard-paths = false
deny = []
external-default-features = "deny"
highlight = "all"
multiple-versions = "deny"
multiple-versions-include-dev = true
skip = [
  { crate = "base64@0.22.1", reason = "reqwest depends on base64 0.22, and hyper-util on 0.23" },
  { crate = "cpufeatures@0.2.17", reason = "sha2 depends on cpufeatures 0.2, and blake3 and chacha20 on 0.3" },
  { crate = "getrandom@0.2.17", reason = "ring depends on getrandom 0.2, and quinn-proto, rand and tempfile on 0.4" },
  { crate = "windows-sys@0.52.0", reason = "ring depends on windows-sys 0.52, and tokio, tempfile and 10 other crates on 0.61" },
]
skip-tree = []
wildcards = "deny"
workspace-default-features = "deny"

# Each crate allowed to keep its default features. cargo-deny then denies each other feature the
